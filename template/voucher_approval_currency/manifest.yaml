name: voucher_approval_currency
title_v: Chứng từ mới — CÓ duyệt, CÓ ngoại tệ (skeleton đầy đủ)
jev_desc: "CREATE a brand-new voucher suite (chung tu moi / voucher) WITH an
  approval flow (duyet/APV: Approval grid + filter + ApprovalItem + files +
  kieu duyet 015xx) AND WITH foreign currency (ma_nt, ty_gia, _nt columns,
  Currency behavior JS): full controller suite + 2 Main aspx (voucher page +
  approval page) + SYS/APP SQL skeleton. Pick when UR asks tao chung tu/
  voucher moi WITH BOTH duyet AND ma_nt/ngoai te/ty gia. NOT for: modifying
  an existing voucher (use none), retrieve flow (retrieve_flow_*), approval
  without currency (voucher_approval_no_currency), currency without approval
  (voucher_normal_currency)."
