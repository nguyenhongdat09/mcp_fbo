name: report_normal
title_v: Báo cáo thường (Filter + Grid + Report, không pivot/dropdown mẫu)
jev_desc: "Standard listing/detail report - Filter + Grid + Report controller, no pivot, no template-form dropdown"
files:
  - src: filter.xml
    dst: App_Data/Controllers/Filter/{new}.xml
  - src: grid.xml
    dst: App_Data/Controllers/Grid/{new}.xml
  - src: report.xml
    dst: App_Data/Controllers/Report/{new}.xml
  - src: main.aspx
    dst: Main/{new}.aspx
tokens:
  "{{controller}}": "{new}"
  "{{proc}}": "rs_{new}"
  # title_v/e(+_upper) cố tình KHÔNG auto-fill — phải là tiêu đề thật,
  # TUYỆT ĐỐI không được = mã controller (xem TITLE trong edit_guide)
edit_guide: |
  Sau khi clone_things type=4:
  TITLE (bắt buộc — KHÔNG auto-fill, nằm trong unresolved_placeholders):
  {{title_v}} = tiêu đề TIẾNG VIỆT, {{title_e}} = tiếng Anh của báo cáo
  (vd 'Tính tiền thuế cho hàng dùng chung có tồn kho' / 'Calculate Tax
  For Shared Goods In Inventory') — lấy từ UR hoặc hỏi user, TUYỆT ĐỐI
  không để = mã {new}. Vị trí: v=/e= ở Main/{new}.aspx, <title> ở
  Filter+Grid, header ở report.xml. {{title_v_upper}}/{{title_e_upper}}
  = cùng tiêu đề viết HOA (header report.xml).
  ASPX ATTR: ReadOnly="true" = mọi cột grid readonly (list chỉ xem, sửa
  qua form); FilterMode="true" = F5 hiện Filter trước → bấm nút Filter
  mới vào Grid. Báo cáo → FilterMode="true"; danh mục/chứng từ →
  "false". ReadOnly="false" chỉ khi chức năng cho sửa trực tiếp trên
  grid (vd màn phân bổ).
  1. Viết proc {{proc}} (rs_{new}) nhận đúng thứ tự param trong
     Filter Processing, đổ recordset vào '#$query'; cột trả ra khớp
     field trong Grid.
  2. Đổi field lọc name_* và cột Grid theo UR; giữ systotal nếu proc
     dùng cơ chế valid="systotal = 1".
  3. report.xml khai báo form in (reportFile .rpt / templateFile .xlsx) —
     file in thiết kế ngoài, KHÔNG có trong template.
  4. Đổi {{proc}} prefix nếu project dùng zc_ thay rs_.
  5. Main/{new}.aspx là ENTRY POINT mở báo cáo (ReportExtender
     Controller={new}) — BẮT BUỘC phải có, KHÔNG được bỏ qua.
  6. Đăng ký menu thủ công trỏ tới Main/{new}.aspx.
