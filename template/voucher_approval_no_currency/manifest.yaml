name: voucher_approval_no_currency
title_v: Chứng từ mới — CÓ duyệt, KHÔNG ngoại tệ (skeleton đầy đủ)
jev_desc: "CREATE a brand-new voucher suite (chung tu moi / voucher) WITH an
  approval flow (duyet/APV: Approval grid + filter + ApprovalItem + files +
  kieu duyet 015xx) but WITHOUT foreign currency: Dir/Grid/Filter/Query/
  Report/Detail/Approval controllers + Include/Extender + Revert.ent +
  Fields Grid.ent + 2 Main aspx (voucher page + approval page) + SYS/APP
  SQL skeleton. Pick when UR asks tao chung tu/voucher moi WITH duyet/
  approval and WITHOUT ma_nt/ngoai te. NOT for: modifying an existing
  voucher (use none), retrieve flow (retrieve_flow_*), voucher without
  approval (voucher_normal_*), voucher with currency (*_currency)."
