# FastBusiness MCP Server

server:
  name: "fastbusiness-mcp"
  version: "2.0.0"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" 

# Tùy chọn khi extract/build graph
extract_options:
  shared_include: 0

# Cấu hình Kuzu / graph (options). Path máy: config_path.yaml → fbograph.kuzu_db_base
# (thiếu/rỗng → {MCP_BASE}/KuzuDB)
fbograph:
  user_multi_db_yn: 1
  access_log_retention_days: 30
  query_timeout_seconds: 1800  # 30 phút timeout cho truy vấn Kùzu DB

# RAG QLYC Search API (MCP tool search_qlyc)
rag_qlyc:
  # API RAG chạy trên máy/GPU nội bộ — khớp web_ui (không dùng localhost trừ khi uvicorn chạy cùng máy)
  base_url: "http://172.168.5.14:8000"
  api_key: "fsd@@123"
  timeout_seconds: 30
  bp_lt: "FSD"

# Clone SQL objects giữa 2 project (MCP tool clone_things)
# Path máy: config_path.yaml → clone_things.sql_temp_folder (thiếu/rỗng → {MCP_BASE}/Scripts)
clone_things:
  # Cách mở file sau khi ghi: auto | cursor | code | os | none
  open_editor_cmd: "auto"

  # Giới hạn an toàn
  max_objects: 50

  # Ngưỡng ký tự mode_read=3: vượt ngưỡng → spill full body ra definition_path, agent đọc bằng read_local_file (né client-side truncation)
  mode_read_full_max_chars: 15000

  # type=2 (clone data): số dòng tối đa lấy theo WHERE — vượt → truncated
  data_max_rows: 1000

  # false = chỉ ghi file, không mở UI
  open_file: true

  # true = tự động deploy (EXECUTE DDL/definition) lên DB target; false = chỉ ghi file .sql
  execute_clone: false

# Response oversize guard (spill ra file local khi vượt ngưỡng token client)
response_guard:
  max_chars: 60000   # response tool > ngưỡng này → spill ra logs/overflow-*.json


