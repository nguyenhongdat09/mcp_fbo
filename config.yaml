# FastBusiness MCP Server

server:
  name: "fastbusiness-mcp"
  version: "2.0.0"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" 

# Tùy chọn khi extract/build graph
extract_options:
  shared_include: 0

# Cấu hình lưu trữ Kuzu DB cục bộ
fbograph:
  kuzu_db_base: "C:/KuzuDB"
  user_multi_db_yn: 1
  access_log_retention_days: 30

# RAG QLYC Search API (MCP tool search_qlyc)
rag_qlyc:
  # API RAG chạy trên máy/GPU nội bộ — khớp web_ui (không dùng localhost trừ khi uvicorn chạy cùng máy)
  base_url: "http://172.168.5.14:8000"
  api_key: "fsd@@123"
  timeout_seconds: 30
  bp_lt: "FSD"

# Clone SQL objects giữa 2 project (MCP tool clone_things)
clone_things:
  # Absolute path thư mục tạo file .sql khi path_to_pasted rỗng
  # Parity với VS Code setting: fbo-autocomplete.sqlTempFolder
  sql_temp_folder: "e:/SQL Temp"

  # Cách mở file sau khi ghi: auto | cursor | code | os | none
  open_editor_cmd: "auto"

  # Giới hạn an toàn
  max_objects: 50

  # false = chỉ ghi file, không mở UI
  open_file: true

  # true = tự động deploy (EXECUTE DDL/definition) lên DB target; false = chỉ ghi file .sql
  execute_clone: false
