# COMMON CODE PATTERNS
# Frequently used JavaScript patterns for FastBusiness

patterns:

  # ============================================
  # FORM PATTERNS
  # ============================================

  form_init_new:
    name: "Initialize form with default values"
    context: "Form (Dir)"
    location: "active$Form$ function"
    description: "Set default values when opening new form"
    template: |
      function active$Form$(f) {
          if (f._action === 'New') {
              // Set default date
              f.setItemValue('ngay_ct', new Date());

              // Set default status
              f.setItemValue('status', 1);

              // Set default currency
              f.setItemValue('ma_nt', 'VND');
              f.setItemValue('ty_gia', 1);

              // Set default unit/branch from system
              f.setItemValue('ma_dvcs', '@@unit');

              // Focus to first field
              f.getItem('ma_kh').focus();
          }
      }
    variables:
      - name: "ngay_ct"
        description: "Date field name"
      - name: "status"
        description: "Status field name"
      - name: "ma_kh"
        description: "First field to focus"

  form_field_onchange:
    name: "Field onChange handler"
    context: "Form (Dir)"
    location: "onChange$Voucher$field_name function"
    description: "Handle field value change"
    template: |
      function onChange$Voucher${{field_name}}(sender) {
          var f = sender.parentForm;

          // Skip in view mode
          if (f._action === 'View') {
              return;
          }

          var value = f.getItemValue('{{field_name}}');

          // Your logic here
          {{logic}}
      }
    variables:
      - name: "field_name"
        description: "Field name (e.g., ma_kh, so_luong)"
      - name: "logic"
        description: "Custom logic code"

  form_load_data_onchange:
    name: "Load data from server on field change"
    context: "Form (Dir)"
    location: "onChange handler + ResponseComplete"
    description: "Load related data via AJAX when field changes"
    template: |
      // Field change handler
      function onChange$Voucher${{field_name}}(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          var value = f.getItemValue('{{field_name}}');

          if (value) {
              // Validate first
              if (!f.validFields('{{field_name}}')) {
                  return;
              }

              // Send AJAX request
              f.request('{{action_id}}', '{{context}}', ['{{field_name}}'], sender);
          } else {
              // Clear related fields
              {{clear_fields}}
          }
      }

      // Response handler
      function on$Form$ResponseComplete(sender, e) {
          var f = e.object;

          if (e.type.Context === '{{context}}') {
              var result = e.type.Result;

              if (result && result.length > 0) {
                  // Access by INDEX! (0-based, matches SQL select order)
                  {{result_mapping}}
              } else {
                  alert('{{not_found_message}}');
                  f.getItem('{{field_name}}').focus();
              }
          }
      }
    variables:
      - name: "field_name"
        description: "Field name triggering load (e.g., ma_kh)"
      - name: "action_id"
        description: "Action ID from XML <action> (e.g., GetCustomer)"
      - name: "context"
        description: "Context string for ResponseComplete (e.g., GetCustomer)"
      - name: "clear_fields"
        description: "Code to clear related fields"
      - name: "result_mapping"
        description: "Code to map result[index].Value to form fields"
      - name: "not_found_message"
        description: "Error message if not found"
    example: |
      // Example: Load customer data
      function onChange$Voucher$ma_kh(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          var maKH = f.getItemValue('ma_kh');

          if (maKH) {
              if (!f.validFields('ma_kh')) {
                  return;
              }

              f.request('GetCustomer', 'GetCustomer', ['ma_kh'], sender);
          } else {
              f.setItemValue('ten_kh', '');
              f.setItemValue('dia_chi', '');
          }
      }

      function on$Form$ResponseComplete(sender, e) {
          var f = e.object;

          if (e.type.Context === 'GetCustomer') {
              var result = e.type.Result;

              if (result && result.length > 0) {
                  // SQL: select ma_kh, ten_kh, dia_chi, dien_thoai
                  var tenKH = result[1].Value;      // Index 1 = ten_kh
                  var diaChi = result[2].Value;     // Index 2 = dia_chi
                  var dienThoai = result[3].Value;  // Index 3 = dien_thoai

                  f.setItemValue('ten_kh', tenKH);
                  f.setItemValue('dia_chi', diaChi);
                  f.setItemValue('dien_thoai', dienThoai);
              } else {
                  alert('Không tìm thấy khách hàng');
                  f.getItem('ma_kh').focus();
              }
          }
      }

  form_calculate_field:
    name: "Calculate field value"
    context: "Form (Dir)"
    location: "onChange handler"
    description: "Calculate field based on other fields"
    template: |
      function onChange$Voucher${{field_name}}(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          {{get_values}}

          // Calculate
          var {{result_field}} = {{calculation}};

          // Set result
          f.setItemValue('{{result_field}}', {{result_field}});
      }
    variables:
      - name: "field_name"
        description: "Field triggering calculation"
      - name: "get_values"
        description: "Code to get input values"
      - name: "result_field"
        description: "Field to store result"
      - name: "calculation"
        description: "Calculation expression"
    example: |
      // Example: Calculate total = quantity * price
      function onChange$Voucher$so_luong(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          var soLuong = f.getItemValue('so_luong');
          var gia = f.getItemValue('gia');

          var tien = soLuong * gia;

          f.setItemValue('tien', tien);
      }

  form_conditional_readonly:
    name: "Set fields readonly based on condition"
    context: "Form (Dir)"
    location: "active$Form$ function"
    description: "Make fields readonly based on status or other conditions"
    template: |
      function active$Form$(f) {
          var {{condition_field}} = f.getItemValue('{{condition_field}}');

          if ({{condition}}) {
              f.setReadOnlyFields('{{readonly_fields}}');
          }
      }
    variables:
      - name: "condition_field"
        description: "Field to check condition"
      - name: "condition"
        description: "Condition expression"
      - name: "readonly_fields"
        description: "Comma-separated field names to make readonly"
    example: |
      // Example: Make fields readonly when status = Approved (2)
      function active$Form$(f) {
          var status = f.getItemValue('status');

          if (status === 2) {  // Approved
              f.setReadOnlyFields('ma_kh, ngay_ct, tien, so_luong');
          }
      }

  # ============================================
  # GRID DETAIL PATTERNS
  # ============================================

  grid_detail_init:
    name: "Initialize Grid Detail with calculations"
    context: "Grid Detail"
    location: "load$GridName$ function"
    description: "Setup grid calculations and aggregations"
    template: |
      function load${{grid_name}}$(g) {
          // CRITICAL: Get parent form first!
          var f = g.get_element().parentForm;

          // Setup calculations
          g.$a = {
              {{calculations}}
          };

          // Setup header fields for AJAX (if needed)
          g.$h = {
              {{header_fields}}
          };
      }
    variables:
      - name: "grid_name"
        description: "Grid name (e.g., GridAPDetail)"
      - name: "calculations"
        description: "Calculation expressions"
      - name: "header_fields"
        description: "Parent form fields for AJAX"
    example: |
      // Example: Invoice detail grid
      function load$GridAPDetail$(g) {
          var f = g.get_element().parentForm;

          g.$a = {
              // Calculate line total
              tien: '[tien]:=[so_luong]*[gia]',

              // Convert to VND using parent ty_gia
              gia_vnd: '[gia_vnd]:=[gia_nt]*[$ty_gia]',

              // Aggregate to parent form
              t_tien: ['t_tien', 'tien']
          };

          g.$h = {
              ty_gia: '[$ty_gia]',
              ngay_ct: '[$ngay_ct]'
          };
      }

  grid_detail_cell_onchange:
    name: "Grid Detail cell onChange"
    context: "Grid Detail"
    location: "onChange$Voucher$GridName$field_name"
    description: "Handle cell value change in grid detail"
    template: |
      function onChange$Voucher${{grid_name}}${{field_name}}(sender) {
          var g = sender.grid;
          var f = g.get_element().parentForm;

          var row = g._activeRow;

          // Get column indexes
          {{get_columns}}

          // Get values
          {{get_values}}

          // Calculate
          {{calculation}}

          // Set result
          g._setItemValue(row, {{result_col}}, {{result_value}});
      }
    variables:
      - name: "grid_name"
        description: "Grid name"
      - name: "field_name"
        description: "Field name that changed"
      - name: "get_columns"
        description: "Code to get column indexes"
      - name: "get_values"
        description: "Code to get cell values"
      - name: "calculation"
        description: "Calculation logic"
      - name: "result_col"
        description: "Result column variable"
      - name: "result_value"
        description: "Result value variable"
    example: |
      // Example: Calculate total when quantity or price changes
      function onChange$Voucher$APDetail$so_luong(sender) {
          var g = sender.grid;
          var f = g.get_element().parentForm;

          var row = g._activeRow;

          // Get column indexes
          var colSoLuong = g._getColumnOrder('so_luong');
          var colGia = g._getColumnOrder('gia');
          var colTien = g._getColumnOrder('tien');

          // Get values
          var soLuong = g._getItemValue(row, colSoLuong);
          var gia = g._getItemValue(row, colGia);

          // Calculate
          var tien = soLuong * gia;

          // Set result
          g._setItemValue(row, colTien, tien);
      }

  grid_detail_add_row_from_form:
    name: "Add grid row from form"
    context: "Form (Dir) with Grid Detail"
    location: "active$Form$ or button handler"
    description: "Add empty row to grid detail from form code"
    template: |
      function {{function_name}}({{params}}) {
          {{get_form}}

          if (f._action === 'New') {
              var g = f.grid;
              g._appendRow(null, true);  // Add empty row and focus
          }
      }
    variables:
      - name: "function_name"
        description: "Function name"
      - name: "params"
        description: "Function parameters"
      - name: "get_form"
        description: "Code to get form object"
    example: |
      // Example: Add row on form load
      function active$Form$(f) {
          if (f._action === 'New') {
              var g = f.grid;
              g._appendRow(null, true);
          }
      }

  grid_detail_recalc_on_parent_change:
    name: "Recalculate grid when parent field changes"
    context: "Form (Dir) with Grid Detail"
    location: "onChange handler for parent field"
    description: "Trigger grid recalculation when parent field changes"
    template: |
      function onChange$Voucher${{field_name}}(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          var g = f.grid;

          // Recalculate all rows
          g.executeAggregate([g.$a.{{aggregate_field}}]);
      }
    variables:
      - name: "field_name"
        description: "Parent field name that changed"
      - name: "aggregate_field"
        description: "Aggregate field to recalculate"
    example: |
      // Example: Recalculate when exchange rate changes
      function onChange$Voucher$ty_gia(sender) {
          var f = sender.parentForm;

          if (f._action === 'View') {
              return;
          }

          var g = f.grid;

          // Recalculate all rows
          g.executeAggregate([g.$a.t_tien]);
      }

  # ============================================
  # GRID VIEW PATTERNS
  # ============================================

  grid_view_load:
    name: "Grid View load handler"
    context: "Grid View"
    location: "load$Grid function"
    description: "Initialize standalone grid view"
    template: |
      function load$Grid(g) {
          // Only grid operations, NO parent form!

          {{initialization}}
      }
    variables:
      - name: "initialization"
        description: "Grid initialization code"
    example: |
      // Example: Grid View load
      function load$Grid(g) {
          // Only use g.xxx API
          // NO parent form access!

          var row = g._activeRow;
          var col = g._getColumnOrder('ma_kh');
          var value = g._getItemValue(row, col);
      }

  # ============================================
  # LOOKUP PATTERNS
  # ============================================

  lookup_reload_on_filter_change:
    name: "Reload lookup when filter field changes"
    context: "Form (Dir)"
    location: "onChange handler"
    description: "Refresh lookup list when its filter condition changes"
    template: |
      function onChange$Voucher${{filter_field}}(sender) {
          var f = sender.parentForm;

          // Reload dependent lookup
          f.setReferenceKeyFilter('{{lookup_field}}');
      }
    variables:
      - name: "filter_field"
        description: "Field that affects lookup filter"
      - name: "lookup_field"
        description: "Lookup field to reload"
    example: |
      // Example: Reload employee lookup when department changes
      // ma_nv lookup has condition: ma_bp = '{$%c[ma_bp]}'
      function onChange$Voucher$ma_bp(sender) {
          var f = sender.parentForm;

          // Reload ma_nv lookup with new ma_bp filter
          f.setReferenceKeyFilter('ma_nv');
      }

# ============================================
# CODE SNIPPETS (Reusable blocks)
# ============================================

snippets:

  get_parent_form_from_grid:
    code: "var f = g.get_element().parentForm;"
    description: "Get parent form from grid detail"
    critical: true

  get_grid_from_form:
    code: "var g = f.grid;"
    description: "Get grid detail from form"

  get_form_from_sender:
    code: "var f = sender.parentForm;"
    description: "Get form from sender (field object)"

  get_grid_from_sender:
    code: "var g = sender.grid;"
    description: "Get grid from sender (cell object)"

  skip_in_view_mode:
    code: |
      if (f._action === 'View') {
          return;
      }
    description: "Skip processing in view mode"

  validate_field:
    code: |
      if (!f.validFields('{{field_name}}')) {
          return;
      }
    description: "Validate required field"

  get_column_index:
    code: "var col{{FieldName}} = g._getColumnOrder('{{field_name}}');"
    description: "Get column index from field name"

  get_cell_value:
    code: "var {{varName}} = g._getItemValue(row, col{{FieldName}});"
    description: "Get cell value from grid"

  set_cell_value:
    code: "g._setItemValue(row, col{{FieldName}}, {{value}});"
    description: "Set cell value in grid"

  alert_not_found:
    code: |
      alert('{{message}}');
      f.getItem('{{field_name}}').focus();
    description: "Show error and focus field"
