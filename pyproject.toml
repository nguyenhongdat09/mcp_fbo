[project]
name = "fastbusiness-mcp"
version = "2.0.0"
description = "MCP Server for FastBusiness — query SQL + read XML entities"
requires-python = ">=3.10"
authors = [{name = "FastBusiness Team", email = "team@fastbusiness.com"}]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "mcp>=0.9.0",
    "pyyaml>=6.0.0",
    "pyodbc>=5.0.0",
    "lxml>=5.0.0",
    "kuzu>=0.11.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
fastbusiness-mcp = "fastbusiness_mcp.server:main"
fbograph = "xml_codegraph.build_kuzu_projects:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
